name: Verify channel branding with Windows PowerShell 5.1

on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        default: branding
        options: [branding, lifecycle, full, all]

permissions:
  contents: read

jobs:
  branding:
    if: inputs.suite == 'branding' || inputs.suite == 'all'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        installation: [fresh, upgrade]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch authorized protected installers
        timeout-minutes: 3
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download branding-fixed --repo 98624017/aiwork-installer-ps51-20261020-xksqya --pattern branding-setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'candidate-download-failed' }
          gh release download candidate --repo 98624017/aiwork-installer-ps51-20261020-xksqya --pattern baseline-setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'baseline-download-failed' }
      - name: Verify actual branded installation and application under PowerShell 5.1
        shell: powershell
        env:
          INSTALLATION: ${{ matrix.installation }}
        run: |
          $test = @{ ManifestPath = './branding-candidate.json'; PayloadDirectory = './payload'; OutputDirectory = './branding-evidence'; BrandingOnly = $true }
          if ($env:INSTALLATION -eq 'fresh') { $test.FreshCandidate = $true }
          & ./scripts/verify-windows-installer.ps1 @test
      - name: Upload sanitized branding evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: branding-${{ matrix.os }}-${{ matrix.installation }}
          path: branding-evidence/
          retention-days: 7
          if-no-files-found: error

  lifecycle:
    if: inputs.suite == 'lifecycle' || inputs.suite == 'all'
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, current-user, all-users]
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch hash-pinned protected candidate
        timeout-minutes: 2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download branding-fixed --repo 98624017/aiwork-installer-ps51-20261020-xksqya --pattern branding-setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'candidate-download-failed' }
      - name: Install, reinstall and uninstall
        timeout-minutes: 8
        shell: pwsh
        env:
          PROBE_MODE: ${{ matrix.mode }}
        run: |
          & ./scripts/verify-lifecycle.ps1 -Mode $env:PROBE_MODE
          if (-not $?) { throw 'native-lifecycle-failed' }
      - name: Upload sanitized lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: branding-lifecycle-${{ matrix.mode }}
          path: lifecycle-evidence/
          retention-days: 7
          if-no-files-found: error

  full:
    if: inputs.suite == 'full' || inputs.suite == 'all'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch authorized protected installers
        timeout-minutes: 3
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download branding-fixed --repo 98624017/aiwork-installer-ps51-20261020-xksqya --pattern branding-setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'candidate-download-failed' }
          gh release download candidate --repo 98624017/aiwork-installer-ps51-20261020-xksqya --pattern baseline-setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'baseline-download-failed' }
      - name: Verify full interactive installer suite with PowerShell 5.1
        shell: powershell
        run: |
          & ./scripts/verify-windows-installer.ps1 -ManifestPath ./branding-candidate.json -PayloadDirectory ./payload -OutputDirectory ./full-evidence
      - name: Upload sanitized full evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: branding-full-${{ matrix.os }}
          path: full-evidence/
          retention-days: 7
          if-no-files-found: error
