name: Verify official electron-builder installer

on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        default: all
        options: [all, interactive, lifecycle]

permissions:
  contents: read

jobs:
  lifecycle:
    if: inputs.suite != 'interactive'
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, current-user, all-users]
    runs-on: windows-2025
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch hash-pinned protected candidate
        timeout-minutes: 2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download builder-26.15.3 --repo 98624017/aiwork-installer-ps51-20261020-xksqya --pattern official-setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'candidate-download-failed' }
      - name: Install, verify payload and shortcuts, reinstall and uninstall
        timeout-minutes: 5
        shell: pwsh
        env:
          PROBE_MODE: ${{ matrix.mode }}
        run: |
          & ./scripts/verify-lifecycle.ps1 -Mode $env:PROBE_MODE
          if (-not $?) { throw 'native-lifecycle-failed' }
      - name: Upload sanitized lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: official-lifecycle-${{ matrix.mode }}
          path: lifecycle-evidence/
          retention-days: 7
          if-no-files-found: error

  interactive:
    if: inputs.suite != 'lifecycle'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch authorized candidate and baseline
        timeout-minutes: 3
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download builder-26.15.3 --repo 98624017/aiwork-installer-ps51-20261020-xksqya --pattern official-setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'candidate-download-failed' }
          gh release download candidate --repo 98624017/aiwork-installer-ps51-20261020-xksqya --pattern baseline-setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'baseline-download-failed' }
      - name: Verify interactive install and upgrade with Windows PowerShell 5.1
        shell: powershell
        run: |
          & ./scripts/verify-windows-installer.ps1 -ManifestPath ./official-candidate.json -PayloadDirectory ./payload -OutputDirectory ./interactive-evidence
      - name: Upload sanitized interactive evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: official-interactive-${{ matrix.os }}
          path: interactive-evidence/
          retention-days: 7
          if-no-files-found: error
