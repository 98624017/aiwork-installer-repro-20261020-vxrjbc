name: Verify channel branding with Windows PowerShell 5.1

on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        default: branding
        options: [branding, channel-switch, lifecycle, lifecycle-current, full, all, uninstall-diagnostic, uninstall-locked-directory]

permissions:
  contents: read

jobs:
  channel-switch:
    if: inputs.suite == 'channel-switch' || inputs.suite == 'all'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch hash-pinned protected installers
        timeout-minutes: 2
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download branding-fixed-r4 --repo 98624017/aiwork-installer-ps51-20261020-xksqya --pattern branding-setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'candidate-download-failed' }
          gh release download candidate --repo 98624017/aiwork-installer-ps51-20261020-xksqya --pattern baseline-setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'baseline-download-failed' }
      - name: Change channel through the installed package under PowerShell 5.1
        shell: powershell
        run: |
          & ./scripts/verify-windows-installer.ps1 -ManifestPath ./branding-candidate.json -PayloadDirectory ./payload -OutputDirectory ./channel-switch-evidence -BrandingOnly -FreshCandidate -ChannelSwitch
      - name: Upload sanitized channel switch evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: channel-switch-${{ matrix.os }}
          path: channel-switch-evidence/
          retention-days: 7
          if-no-files-found: error

  uninstall-diagnostic:
    if: inputs.suite == 'uninstall-diagnostic' || inputs.suite == 'uninstall-locked-directory'
    strategy:
      fail-fast: false
      matrix:
        invocation: ${{ inputs.suite == 'uninstall-locked-directory' && fromJSON('["locked-directory"]') || fromJSON('["interactive","silent"]') }}
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch hash-pinned protected candidate
        timeout-minutes: 2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download branding-fixed-r4 --repo 98624017/aiwork-installer-ps51-20261020-xksqya --pattern branding-setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'candidate-download-failed' }
      - name: Record actual updated-uninstaller failure details
        timeout-minutes: 4
        shell: powershell
        env:
          DIAGNOSTIC_INVOCATION: ${{ matrix.invocation }}
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'requires-windows-powershell-51' }
          $test = @{ Mode = 'current-user'; UninstallUpdatedDiagnostic = $true }
          if ($env:DIAGNOSTIC_INVOCATION -eq 'silent') { $test.DiagnosticSilent = $true }
          if ($env:DIAGNOSTIC_INVOCATION -eq 'locked-directory') { $test.DiagnosticDirectoryLock = $true }
          & ./scripts/verify-lifecycle.ps1 @test
          if (-not $?) { throw 'native-uninstall-diagnostic-failed' }
      - name: Upload sanitized uninstaller evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: branding-uninstall-diagnostic-${{ matrix.invocation }}
          path: lifecycle-evidence/
          retention-days: 7
          if-no-files-found: error

  branding:
    if: inputs.suite == 'branding' || inputs.suite == 'all'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        installation: [fresh, upgrade]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch authorized protected installers
        timeout-minutes: 3
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download branding-fixed-r4 --repo 98624017/aiwork-installer-ps51-20261020-xksqya --pattern branding-setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'candidate-download-failed' }
          gh release download candidate --repo 98624017/aiwork-installer-ps51-20261020-xksqya --pattern baseline-setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'baseline-download-failed' }
      - name: Verify actual branded installation and application under PowerShell 5.1
        shell: powershell
        env:
          INSTALLATION: ${{ matrix.installation }}
        run: |
          $test = @{ ManifestPath = './branding-candidate.json'; PayloadDirectory = './payload'; OutputDirectory = './branding-evidence'; BrandingOnly = $true }
          if ($env:INSTALLATION -eq 'fresh') { $test.FreshCandidate = $true }
          & ./scripts/verify-windows-installer.ps1 @test
      - name: Upload sanitized branding evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: branding-${{ matrix.os }}-${{ matrix.installation }}
          path: branding-evidence/
          retention-days: 7
          if-no-files-found: error

  lifecycle:
    if: inputs.suite == 'lifecycle' || inputs.suite == 'lifecycle-current' || inputs.suite == 'all'
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ inputs.suite == 'lifecycle-current' && fromJSON('["current-user"]') || fromJSON('["direct","current-user","all-users"]') }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch hash-pinned protected candidate
        timeout-minutes: 2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download branding-fixed-r4 --repo 98624017/aiwork-installer-ps51-20261020-xksqya --pattern branding-setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'candidate-download-failed' }
      - name: Install, reinstall and uninstall
        timeout-minutes: 8
        shell: powershell
        env:
          PROBE_MODE: ${{ matrix.mode }}
        run: |
          & ./scripts/verify-lifecycle.ps1 -Mode $env:PROBE_MODE
          if (-not $?) { throw 'native-lifecycle-failed' }
      - name: Upload sanitized lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: branding-lifecycle-${{ matrix.mode }}
          path: lifecycle-evidence/
          retention-days: 7
          if-no-files-found: error

  full:
    if: inputs.suite == 'full' || inputs.suite == 'all'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch authorized protected installers
        timeout-minutes: 3
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download branding-fixed-r4 --repo 98624017/aiwork-installer-ps51-20261020-xksqya --pattern branding-setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'candidate-download-failed' }
          gh release download candidate --repo 98624017/aiwork-installer-ps51-20261020-xksqya --pattern baseline-setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'baseline-download-failed' }
      - name: Verify driver cleanup regressions with PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'requires-windows-powershell-51' }
          & ./scripts/verify-windows-installer.test.ps1
          if (-not $?) { throw 'driver-regression-failed' }
      - name: Verify full interactive installer suite with PowerShell 5.1
        shell: powershell
        run: |
          & ./scripts/verify-windows-installer.ps1 -ManifestPath ./branding-candidate.json -PayloadDirectory ./payload -OutputDirectory ./full-evidence
      - name: Upload sanitized full evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: branding-full-${{ matrix.os }}
          path: full-evidence/
          retention-days: 7
          if-no-files-found: error
